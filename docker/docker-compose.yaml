version: "3.13"
services:
  pg:
    image: postgres:latest
#    environment:
#      POSTGRES_USER: social_user
#      POSTGRES_PASSWORD: social_pw
#      POSTGRES_DB: social_db
    env_file:
      - ../.env
    ports:
      - "5432:5432"
    volumes:
      - ../pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
